# Se descargan sus velas de 1 hora junto con las del motor táctico, pero
# NO se operan (lo que opera está en config/tactico.yaml).
# El investigador semanal puede añadir aquí los símbolos que necesite
# (símbolos de Alpaca; acciones/ETFs con feed IEX desde 2020).
# En el laboratorio: laboratorio.ohlc_mercado("acciones", extra=True)
# ==========================================================
acciones:
  # ETFs apalancados x3 (muy volátiles: solo con filtro de tendencia y stop)
  - TQQQ   # Nasdaq-100 x3
  - UPRO   # S&P 500 x3
  - SOXL   # semiconductores x3
  - TECL   # tecnología x3
  - TNA    # Russell 2000 x3
  # ETFs inversos (suben cuando el índice baja): para estrategias que ganen en mercados bajistas
  - SH     # S&P 500 inverso x1
  - PSQ    # Nasdaq-100 inverso x1
  - SQQQ   # Nasdaq-100 inverso x3
  - SPXU   # S&P 500 inverso x3
  # ETFs inversos de cripto (forma de ejecutar en Alpaca un corto en BTC/ETH: se COMPRAN como acciones).
  # Solo cotizan en horario de bolsa y pierden valor si se mantienen mucho (reajuste diario).
  - BITI   # Bitcoin inverso x1 (desde jun-2022)
  - SBIT   # Bitcoin inverso x2 (desde abr-2024)
  - SETH   # Ether inverso x1
cripto: []

