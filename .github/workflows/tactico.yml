# Escáner del motor táctico (velas de 1 hora).
# Cada hora en horario de bolsa de EEUU y cada 2 horas el resto (cripto 24/7),
# ajustado para no pasar de los 2.000 minutos gratis al mes del repositorio privado.
# A mano: Actions -> "Escáner táctico" -> Run workflow (con "historico" para la primera descarga)
name: Escáner táctico

on:
  schedule:
    - cron: "7 13-21 * * 1-5"          # horario de EEUU (cubre invierno y verano)
    - cron: "37 0,2,4,8,10,12,23 * * 1-5"  # resto del día laborable (cripto)
    - cron: "37 */2 * * 0,6"           # fines de semana (cripto)
  workflow_dispatch:
    inputs:
      historico:
        description: "Descargar todo el histórico horario (solo la primera vez)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tactico
  cancel-in-progress: false

jobs:
  escaner:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Escáner táctico
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python scripts/run_tactico.py ${{ inputs.historico && '--historico' || '' }}
      - name: Guardar datos y estado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/horario state
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -q -m "Táctico $(date -u +'%Y-%m-%d %H:%M') UTC"
            for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
          fi
