# Velas de 1 hora de forex (Dukascopy) para el laboratorio.
# Sábados a las 05:47 UTC (antes del investigador) y a mano: Actions -> "Datos de forex" -> Run workflow
name: Datos de forex

on:
  schedule:
    - cron: "47 5 * * 6"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pipeline-diario
  cancel-in-progress: false

jobs:
  forex:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Descargar forex
        timeout-minutes: 35
        run: python -u scripts/update_forex.py
      - name: Guardar datos
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/horario/forex || true
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Datos de forex $(date -u +'%Y-%m-%d')"
            git pull --rebase
            git push
          fi
