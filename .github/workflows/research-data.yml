# Descarga semanal de datos para la investigación: tipos de interés (FRED),
# posicionamiento en futuros (COT) y compras de directivos (SEC).
# Sábados a las 06:17 UTC y a mano: Actions -> "Datos de investigación" -> Run workflow
name: Datos de investigación

on:
  schedule:
    - cron: "17 6 * * 6"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pipeline-diario
  cancel-in-progress: false

jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Comprobar fuentes
        run: python scripts/comprobar_fuentes.py
      - name: Descargar datos
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python scripts/update_research_data.py
      - name: Guardar datos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Datos de investigación $(date -u +'%Y-%m-%d')"
            git pull --rebase
            git push
          fi
