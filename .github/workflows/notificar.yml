# Envía un mensaje a Telegram. Lo usa el agente investigador (que no puede
# conectarse a Telegram directamente) para avisar de sus resultados.
name: Notificar

on:
  workflow_dispatch:
    inputs:
      mensaje:
        description: "Texto del mensaje"
        required: true
        type: string

jobs:
  notificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pyyaml
      - name: Enviar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MENSAJE: ${{ inputs.mensaje }}
        run: |
          python -c "
          import os, sys
          sys.path.insert(0, '.')
          from src.alerts import telegram
          telegram.send_message('🧠 Investigador\n\n' + os.environ['MENSAJE'], silencioso=False)
          "
