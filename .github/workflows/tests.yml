# Pruebas automáticas del código: se ejecutan cada vez que cambia el código
# (no cuando el robot solo guarda datos nuevos).
name: Tests

on:
  push:
    paths: ["src/**", "tests/**", "scripts/**", "requirements.txt"]
  workflow_dispatch: {}

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
