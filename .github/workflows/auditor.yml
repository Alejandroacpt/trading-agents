# Informe semanal del auditor: rendimiento en vivo frente a backtest,
# calidad de ejecución y alertas de degradación.
# Lunes a las 07:07 UTC (después de la ejecución de la mañana) y a mano:
# pestaña Actions -> "Auditor semanal" -> Run workflow
name: Auditor semanal

on:
  schedule:
    - cron: "7 7 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pipeline-diario
  cancel-in-progress: false

jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Informe del auditor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/run_auditor.py
      - name: Publicar panel web
        if: always()
        continue-on-error: true
        env:
          PANEL_TOKEN: ${{ secrets.PANEL_TOKEN }}
          PANEL_REPO: Alejandroacpt/panel-trading
        run: bash scripts/publicar_panel.sh

      - name: Guardar el informe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/auditor
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Informe del auditor $(date -u +'%Y-%m-%d')"
            git pull --rebase
            git push
          fi
