# Vigilante: avisa por Telegram si alguna parte del sistema deja de ejecutarse o falla.
# Cada 4 horas (minuto 41) y a mano: Actions -> "Vigilante" -> Run workflow
name: Vigilante

on:
  schedule:
    - cron: "41 */4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install requests pyyaml
      - name: Revisar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/vigilante.py
      - name: Guardar estado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/vigilante.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Vigilante $(date -u +'%Y-%m-%d %H:%M')"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi
