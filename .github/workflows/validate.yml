# Revalida todas las estrategias con los datos más recientes y guarda el
# informe en reports/validacion/. Se ejecuta el día 1 de cada mes y también
# a mano: pestaña Actions -> "Validar estrategias" -> Run workflow
name: Validar estrategias

on:
  schedule:
    - cron: "17 8 1 * *"   # día 1 de cada mes, 08:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pipeline-diario   # no coincidir con la actualización de datos
  cancel-in-progress: false

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validar estrategias
        run: python scripts/run_validation.py
      - name: Guardar el informe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/validacion research
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Validación de estrategias $(date -u +'%Y-%m-%d')"
            git pull --rebase
            git push
          fi
