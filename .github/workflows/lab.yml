# Laboratorio semanal: prueba todas las familias de estrategias en todos los
# mercados y propone las que mejoran lo que ya opera.
# Domingos a las 09:17 UTC y a mano: Actions -> "Laboratorio semanal" -> Run workflow
name: Laboratorio semanal

on:
  schedule:
    - cron: "17 9 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pipeline-diario
  cancel-in-progress: false

jobs:
  laboratorio:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Laboratorio
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/run_lab.py
      - name: Laboratorio táctico
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/run_lab_tactico.py
      - name: Guardar resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/laboratorio research
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Laboratorio $(date -u +'%Y-%m-%d')"
            git pull --rebase
            git push
          fi
